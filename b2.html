<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="b2.css">
</head>
<body>
    <div class="card">
        <div class="backround">
            <div class="logo">&lt;/&gt;</div>
            <div class="sell">Bán chạy</div>
        </div>
        <div class="card-item">
            <div class="item">
                <p>Lập trình</p>
                <span>⭐ 4.9</span>
            </div>
            <div class="infor">
                <h3>Lập trình Web Full Stack</h3>
                <p>Học lập trình web từ cơ bản đến nâng cao với các công nghệ hiện đại nhất</p>

            </div>
            <div class="time">
                <span class="timing"><i class="fa-regular fa-clock"></i> 40 giờ</span>
                <span class="students"><i class="fa-regular fa-user"></i> 12K+ học viên</span>
            </div>
            <hr>
            <div class="cash">
                <div class="money">2.990.000đ</div>
                <button class="button">Xem chi tiết</button>
            </div>
        </div>
    </div>
</body>
</html>
